<div class="chat-container">
  <h2>Gemini AI Chatbot</h2>

  <div class="chat-history">
    <div *ngFor="let chat of chatHistory" class="chat-entry">
      <strong>You:</strong> {{ chat.user_message }}<br />
      <strong>Bot:</strong> {{ chat.bot_reply }}<br /><br />
    </div>
  </div>

  <form (submit)="sendMessage()">
    <input [(ngModel)]="message" name="message" placeholder="Type your message..." required />
    <input [(ngModel)]="persona" name="persona" placeholder="Persona (optional)" />
    <button type="submit">Send</button>
  </form>

  <button (click)="getHistory()">🗂️ Load Chat History</button>
</div>
